name: foododer
description: FastOder Cafe food and grocery delivery app.
publish_to: "none"
version: 1.6.0+8
environment:
  sdk: ">=3.6.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.13.1
  http: ^1.5.0
  firebase_storage: ^13.0.2
  firebase_messaging: ^16.0.2
  firebase_app_check: ^0.4.0
  firebase_crashlytics: ^5.0.2
  cloud_functions: ^6.5.0
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fastoder_cafe_logo.png
    - assets/fastoder_cafe_splash.png
