name: FastOder Cafe Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Create temporary CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/foododer-ci.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias foododer-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=FastOder Cafe CI, OU=Build, O=FastOder Cafe, L=Pakistan, ST=Punjab, C=PK"
          {
            echo "FOODODER_KEYSTORE_PATH=$RUNNER_TEMP/foododer-ci.jks"
            echo "FOODODER_KEYSTORE_PASSWORD=changeit"
            echo "FOODODER_KEY_ALIAS=foododer-ci"
            echo "FOODODER_KEY_PASSWORD=changeit"
          } >> "$GITHUB_ENV"

      - name: Ensure Android Gradle launcher
        run: chmod +x android/gradlew

      - name: Build release APK
        run: flutter build apk --release --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"

      - name: Build release AAB
        run: flutter build appbundle --release --dart-define=GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastOder Cafe-Android-release
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
